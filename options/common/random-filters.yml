-   type: random-noise
    prob: 1.0
    singleRun: true
    sameInAllLayers: true
    applyIn:
        -   value: without
            weight: 10.0
        -   value: both
            weight: 2.0
    colorSpace: # GRAYA adds grey noise; RGBA adds RGB noise
        -   value: GRAYA
            weight: 1.0
        -   value: RGBA
            weight: 1.0
    both:
        level: [5, 100]
        opacity: [25, 75]

-   type: random-pick
    prob: 1.0
    singleRun: true
    sameInAllLayers: true
    applyIn:
        -   value: without
            weight: 10.0
        -   value: both
            weight: 2.0
    both:
        level: [5, 100]
        windowsize: [2, 30]
        opacity: [25, 75]

disableBrushesWithPixelatedEdges: true # Disable brushes that produce pixelated edges, useful upscaling datasets or avoid pixelated restoration
background:
    -   value:
            gray: 255
        weight: 10.0
    -   value: 
            gray: [200, 254]
        weight: 5.0
    -   value: 
            gray: [1, 55]
        weight: 2.5
    -   value: 
            gray: 0
        weight: 5.0
    -   value: 
            type: gradient
            gradient: all
        weight: 2.0
    -   value:
            type: texture
            blendingMode: [soft_light, gamma_light, hard_light] # https://github.com/KDE/krita/blob/ccbb2fcf3165bdac384a8264a135e030daa120c5/libs/pigment/KoCompositeOpRegistry.h
            opacity: [128, 255]
            pattern: [03_default-paper.png, 04_paper-C-grain.png, 05_paper-torchon.png, 06_hard-grain.png, 08_bump-relief.png, 09_drawed_crosshatched.png, 09b_drawed-CrossedLines.png, 10_drawed_dotted.png, 11_drawed_furry.png, 12_drawed_vertical.png, 13_drawed_swirl.png, 14_texture-rock.png, 15_texture-rockB.png, 16_texture-woody.png, 17_texture-melt.png, 18_texture-bark.png, 18b_WaveFlex.png, 19_texture-crackle.png, 20_texture-vegetal.png, 21_texture-chainmail.png, 22_texture-reptile.png, 4-paper-soft-grain_testdark-black15.png, Canvas 04]
            patternSize: 
                min: [0.1, 1.1]
                max: [1.1, 2.1]
        weight: 2.0

halftone:
    angle:
        -   value: 45
            weight: 5.0 
        -   value: [42.1, 47.9] # range, decimal value for decimal range
            weight: 1.0
        -   value: 0
            weight: 1.0
size:
    size: [500, 2000] # Force square image
    # width: [500, 2000]
    # height: [500, 2000]
    multiple: 4

lineart:
    invertBackground:
        prob: 0.5
    brush: 
        name: '' # Use group if name is empty (Random brush from group)
        category: [pencil, ink, charcoal, sketching]
        size: [1.9, 19.9]
        colors:
            file: options/common/colors.yml
    cubicPercentage: [0.6, 1.0]
    sublines: # TODO: Not implemented yet
        active:
            prob: 0.4
        min: [1, 3]
        max: [4, 6]
        offset: [1, 10] # Max offset distance between sublines (size of the brush will be added), Randomized

lineart-texture:
    invertBackground:
        prob: 0.5
    brush: 
        colors:
            file: options/common/colors.yml
    cubicPercentage: [0.6, 1.0]
    sublines: # TODO: Not implemented yet
        active:
            prob: 0.4

lineart-random:
    invertBackground:
        prob: 0.5
    brush: 
        colors:
            file: options/common/colors.yml
    cubicPercentage: [0.6, 1.0]
    sublines: # TODO: Not implemented yet
        active:
            prob: 0.4

panels-lineart:
    invertBackground:
        prob: 0.5
    brush: 
        name: '' # Use group if name is empty (Random brush from group)
        category:
            -   value: [ink, sketching]
                weight: 2.0
            -   value: [pencil, ink, charcoal, sketching]
                weight: 1.0
        size:
            -   value: [1.9, 4.9]
                weight: 1.0
            -   value: [1.9, 9.9]
                weight: 1.0
        colors:
            file: options/common/colors.yml
    cubicPercentage: [0.6, 1.0]
    sublines: # TODO: Not implemented yet
        active:
            prob: 0.4

# TODO: Not implemented yet
shading:
    type: 
        -   value: hard
            weight: 1.0
        -   value: smoth
            weight: 1.0
        -   value: mix
            weight: 1.0
    hard:
        lineart:
            prob: 0.3
    smoth:
        size: [5, 50]
    mix:
        distribution: [0.3, 0.7] # Range of proportion of hard and smoth shading, the value below means hard and the value above means smoth (Example if distribution is 0.4, then 40% hard and 60% smoth)

# This is also used in black-white (gray) images
colors:
    gray:
        -   value: 
                min: 127
                max: 255
            weight: 3.0
        -   value: 
                min: 0
                max: 255
            weight: 1.0
    alpha:
        -   value: 
                min: 255
                max: 255
            weight: 5.0
        -   value: 
                min: 100
                max: 255
            weight: 1.0
    colorTone: # Only if colored is not active
        active:
            prob: 0.2
        offset:
            r: [-20, 20]
            g: [-20, 20]
            b: [-20, 20]
    colored:
        active:
            prob: 0.2
        paletteColors: [3, 20] # A new palette will be created with this amount of colors.
        similarColors:  # Agrupate colors in a range of similar colors, 0 disables similar colors
            -   value: [0, 3]
                weight: 1.0
            -   value: [5, 9]
                weight: 1.0
        differentColors: # Use direfent colors inside same paint (By default similar colors are used inside same paint)
            prob: 0.5
        palette:
            name: ['rand', 'Animation Color Set', 'Concept-cookie', 'Default', 'Swatches', 'PixelArt 32', 'Gradient', 'Markers']